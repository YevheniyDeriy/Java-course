name: Maven verification
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw --batch-mode --no-transfer-progress verify
      - run: ./mvnw --batch-mode --no-transfer-progress exec:java -Dexec.mainClass=com.eugene.notesapp.JdbcDemo
      - run: ./mvnw --batch-mode --no-transfer-progress exec:java
      - run: ./mvnw --batch-mode --no-transfer-progress exec:java -Dexec.mainClass=com.eugene.notesapp.OrmPitfallsDemo
      - run: ./mvnw --batch-mode --no-transfer-progress exec:java -Dexec.mainClass=com.eugene.notesapp.SchemaValidationDemo
